{% extends "base.html" %}
{% load custom_filters %}
{% block title %}Edit Target{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Target: {{ row.kra.name }}</h2>
    <a href="{% url 'core:my_ipcr' %}?period={{ ipcr.rating_period.id }}" class="btn btn-secondary">&larr; Back to My IPCR</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for col in all_columns %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ col.name }}</label>
                    <textarea name="col_{{ col.id }}" class="form-control" rows="2" {% if col.is_required %}required{% endif %}>{% with val=row.dynamic_data|default_if_none:'' %}{{ val|get_item:col.name|default:"" }}{% endwith %}</textarea>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary mt-3">Update Target</button>
        </form>
    </div>
</div>
{% endblock %}
